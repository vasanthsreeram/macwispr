# Build + smoke test on every push/PR to main.
# No signing secrets required (ad-hoc packaged build).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & self-test
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Xcode + Metal
        run: |
          # GitHub macos runners often need sudo for xcode-select (else exit 1 immediately).
          if [ -d /Applications/Xcode.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          elif [ -d /Applications/Xcode_26.5.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          elif [ -d /Applications/Xcode_26.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          fi
          sudo xcodebuild -runFirstLaunch || xcodebuild -runFirstLaunch || true
          xcodebuild -downloadComponent MetalToolchain || true
          ./scripts/preflight-xcode.sh

      - name: Cache on-device ASR weights
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/qwen3-speech
            ~/.cache/huggingface
          key: qwen-asr-0.6b-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            qwen-asr-0.6b-${{ runner.os }}-

      - name: Unit tests (no model download)
        run: swift test --filter MacWisprCoreTests

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Verify Developer ID not required for CI
        run: |
          codesign -dv dist/MacWispr.app 2>&1 | grep -E 'Signature|Identifier' || true
          test -f dist/MacWispr.app/Contents/MacOS/mlx.metallib
          test -f dist/MacWispr.app/Contents/Frameworks/Sparkle.framework/Sparkle

      - name: Self-test
        run: dist/MacWispr.app/Contents/MacOS/MacWispr --self-test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacWispr-ci-${{ github.sha }}
          path: |
            dist/MacWispr.app
            dist/MacWispr-*-macos-arm64.zip
          retention-days: 7
          if-no-files-found: error