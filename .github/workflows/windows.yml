# Builds MacWispr for Windows and tests it on a real Windows desktop runner.
# Artifacts only; publishing stays manual (see windows/README.md).
name: Windows

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Add a real audio endpoint (VB-Audio Virtual Cable, signed driver)
        run: ./tests/ci_install_vbcable.ps1

      - name: Build (unit tests, PyInstaller, zip, installer)
        run: ./build.ps1

      - name: Self-test (clipboard, keyboard hook, mic, model download + transcription)
        run: |
          $p = Start-Process dist\MacWispr\MacWispr.exe -PassThru -Wait -ArgumentList `
            '--self-test','--wav','..\bench\clips\sample_10s_16k.wav','--out',"$PWD\selftest.json"
          Get-Content selftest.json
          $r = Get-Content selftest.json | ConvertFrom-Json
          if (-not $r.ok) { throw "self-test failed" }
          if ($r.checks.model.detail.text -notmatch 'springboard') { throw "unexpected transcript" }
          New-Item -ItemType Directory -Force evidence | Out-Null
          Copy-Item selftest.json evidence\

      - name: Capture probe (devices, formats, known-audio round trip through the app's Recorder)
        if: always()
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          # Windows microphone privacy switches (machine / user) as found on the runner; not changed.
          foreach ($k in 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone',
                         'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone',
                         'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone\NonPackaged') {
            "$k = $((Get-ItemProperty $k -ErrorAction SilentlyContinue).Value)"
          }
          .venv\Scripts\python.exe tests\ci_capture_probe.py ..\bench\clips\sample_10s_16k.wav evidence

      - name: Installer installs and launches
        run: |
          $setup = Get-ChildItem out\*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -Wait -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          $exe = "$env:LOCALAPPDATA\Programs\MacWispr\MacWispr.exe"
          if (-not (Test-Path $exe)) { throw "installer did not install $exe" }
          Start-Process $exe -Wait -ArgumentList '--version','--out',"$PWD\version.json"
          Get-Content version.json
          Get-FileHash out\* -Algorithm SHA256 | Format-Table -AutoSize | Out-String -Width 200

      - name: End-to-end through the cable with the installed app (hold, toggle, 68.8 s)
        run: |
          try {
            .venv\Scripts\python.exe tests\e2e_capture.py "$env:LOCALAPPDATA\Programs\MacWispr\MacWispr.exe" ..\bench\clips evidence
            if ($LASTEXITCODE) { throw "end-to-end capture failed" }
          } finally {
            Copy-Item "$env:LOCALAPPDATA\MacWispr\macwispr.log" evidence\app.log -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MacWispr-windows-${{ github.sha }}
          path: |
            windows/out/*
            windows/evidence/*
          retention-days: 14
